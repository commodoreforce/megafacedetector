<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smista Foto</title>
<link rel="icon" type="image/png" href="/web/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="/web/stile.css">
</head>
<body>
<a class="sr" href="#vista">Vai al contenuto</a>
<div class="app">
  <aside class="rail" aria-label="Navigazione">
    <div class="marchio"><img src="/web/scudetto.png" alt="Cesena FC"><span>SMISTA<br>FOTO</span></div>
    <nav class="nav" id="nav">
      <a href="#/" data-vista="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="et">Inizio</span></a>
      <a href="#/smista" data-vista="smista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span class="et">Smista foto</span></a>
      <a href="#/cartelle" data-vista="cartelle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 13l2 2 4-4"/></svg><span class="et">Cartelle</span><span class="conta nascosto" id="contaDaFare"></span></a>
      <a href="#/storico" data-vista="storico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="et">Revisioni</span><span class="conta nascosto" id="contaRevisioni"></span></a>
      <a href="#/volti" data-vista="volti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="et">Giocatori e staff</span><span class="conta nascosto" id="contaDeboli"></span></a>
      <a href="#/strumenti" data-vista="strumenti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4l10-10-4-4L4 16zM14 6l4 4"/></svg><span class="et">Prove e regole</span></a>
      <a href="#/aiuto" data-vista="aiuto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg><span class="et">Aiuto</span></a>
    </nav>
    <div class="piede">
      <div id="versione">Smista Foto</div>
      <button type="button" id="bTema">Tema: automatico</button>
      <button type="button" id="bEsci">Chiudi Smista Foto</button>
    </div>
  </aside>
  <div class="contenuto">
    <header class="testa">
      <span class="titolo-vista" id="titoloVista">Inizio</span>
      <button type="button" class="stato-mega" id="statoMega" aria-live="polite">
        <span class="semaforo" id="semaforo" aria-hidden="true"><i class="r"></i><i class="g"></i><i class="v"></i></span>
        <span class="et"><b id="megaTitolo">Controllo MEGA</b><small id="megaSub"></small></span>
      </button>
    </header>
    <main class="vista" id="vista" tabindex="-1"></main>
  </div>
</div>

<div class="barra-attivita" role="status" aria-live="polite">
  <span class="fase" id="faseAtt">Nessuna attività in corso</span>
  <div class="progresso nascosto" id="progAtt"><i></i></div>
  <span class="eta tab-num" id="etaAtt"></span>
  <button type="button" class="btn" id="bRegistro" aria-expanded="false" aria-controls="registro">Registro</button>
</div>
<section class="registro nascosto" id="registro" aria-label="Registro delle attività">
  <header><b>Registro</b><span class="tenue piccolo">tutto quello che fa lo script, in ordine</span>
    <button type="button" class="btn piatto" id="bChiudiRegistro" style="margin-left:auto" aria-label="Chiudi il registro">Chiudi</button></header>
  <div class="righe" id="righe"></div>
</section>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/web/app.js"></script>
<script src="/web/revisione.js"></script>
<script src="/web/aiuto.js"></script>
</body>
</html>
